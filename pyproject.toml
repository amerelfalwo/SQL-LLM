[project]
name = "sql-llm"
version = "0.1.0"
description = "Text-to-SQL demo: Qwen2.5-Coder-3B LoRA served from Colab, queried against the Chinook SQLite database"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
dev = "sql_llm.runner:run_all"
sql-llm = "sql_llm.cli:main"
sql-llm-api = "sql_llm.api:serve"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["EXE002"]

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
